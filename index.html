<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT・デジ戦新春ドラコン｜公式スイングチャレンジ</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
      background: repeating-linear-gradient(
        90deg,
        #c00 0px,
        #c00 40px,
        #fff 40px,
        #fff 80px
      );
    }
    h1 {
      margin: 6px 0;
      font-size: 22px;
    }
    .note {
      background: rgba(255,255,255,0.97);
      border-radius: 12px;
      padding: 10px;
      margin: 8px auto;
      max-width: 520px;
      font-size: 13px;
    }
    button {
      font-size: 16px;
      padding: 8px 14px;
      margin: 4px;
      border-radius: 8px;
      border: none;
    }
    #app {
      display: none;
      background: rgba(255,255,255,0.97);
      border-radius: 12px;
      padding: 10px;
      max-width: 520px;
      margin: 0 auto;
    }
    #details ul {
      list-style: none;
      padding: 0;
      margin: 6px 0;
      font-size: 14px;
    }
    #result h2 {
      margin: 6px 0;
    }
  </style>
</head>
<body>

<h1>IT・デジ戦 新春ドラコン</h1>
<p><strong>公式スイングシミュレーション</strong></p>
<p id="authStatus"></p>

<div class="note">
  <strong>【注意事項】</strong><br>
  ・周囲に人や物がないことを確認してください。<br>
  ・スマートフォンの落下に十分ご注意ください。<br>
  ・全力で振る必要はありません。<br>
  ・本企画は体感イベント用シミュレーションです。
</div>

<div id="app">
  <p style="margin:6px 0; font-size:14px;">
    スマートフォンをゴルフクラブのように握り、2秒間スイング（全3回）
  </p>

  <div style="display:flex; justify-content:center; gap:10px; margin:8px 0;">
    <button onclick="startSwing()">スイング開始</button>
    <button onclick="resetAll()">リセット</button>
  </div>

  <div id="status"></div>
  <div id="details"></div>
  <div id="result"></div>
</div>

<div class="note" style="margin-top:12px;">
  これは、ChatGPT（無料版）を使用し、<br>
  プロンプトによる指示のみで作成したものです。<br>
  <strong>Kizuna運動 地域社会との絆チーム</strong>
</div>

<script>
/***********************
 * 認証処理（QRトークン方式）
 ***********************/
const VALID_TOKENS = [
  'ITDIGI2026'
];

const token = new URLSearchParams(location.search).get('token');

if (VALID_TOKENS.includes(token)) {
  document.getElementById('authStatus').innerHTML =
    '🔓 <strong>認証済み</strong>：チャレンジ可能';
  document.getElementById('app').style.display = 'block';
} else {
  document.getElementById('authStatus').innerHTML =
    '❌ <strong>認証エラー</strong><br>配布されたQRコードからアクセスしてください';
}

/***********************
 * スイング計測処理
 ***********************/
let swings = [];
let listening = false;
let maxAccel = 0;

function startSwing() {
  if (swings.length >= 3) return;

  maxAccel = 0;
  listening = true;
  document.getElementById('status').innerText =
    `スイング ${swings.length + 1} / 3 測定中…`;

  setTimeout(() => {
    listening = false;
    const distance = accelToDistance(maxAccel);
    swings.push(distance);

    document.getElementById('status').innerText =
      `スイング${swings.length} 測定完了`;

    updateDetails();

    if (swings.length === 3) showResult();
  }, 2000);
}

/***********************
 * 飛距離算出（改良モデル）
 ***********************/
function accelToDistance(accel) {
  // 微振動を除去し、300yd張り付き防止の非線形モデル
  const normalized = Math.max(accel - 9, 0);
  const raw = Math.sqrt(normalized) * 55 + 120;
  return Math.min(raw, 299.9);
}

/***********************
 * 結果表示
 ***********************/
function showResult() {
  const avg = swings.reduce((a,b)=>a+b,0) / 3;
  const max = Math.max(...swings);
  const min = Math.min(...swings);
  const deviation = max - min;

  let penalty = 0;
  if (deviation > 10) penalty = deviation * 0.4;

  const finalScore = Math.max(avg - penalty, 0);

  document.getElementById('result').innerHTML = `
    <p>平均飛距離：${avg.toFixed(1)} yd</p>
    <p>安定性ペナルティ：-${penalty.toFixed(1)} yd</p>
    <h2>公式記録：${finalScore.toFixed(1)} yd</h2>
  `;
}

function updateDetails() {
  let html = '<ul>';
  swings.forEach((d, i) => {
    html += `<li>スイング${i+1}：${d.toFixed(1)} yd</li>`;
  });
  html += '</ul>';
  document.getElementById('details').innerHTML = html;
}

function resetAll() {
  swings = [];
  document.getElementById('status').innerText = '';
  document.getElementById('details').innerText = '';
  document.getElementById('result').innerText = '';
}

/***********************
 * モーションセンサー
 ***********************/
window.addEventListener('devicemotion', (e) => {
  if (!listening) return;
  const a = e.accelerationIncludingGravity;
  if (!a) return;

  const magnitude =
    Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);

  if (magnitude > maxAccel) maxAccel = magnitude;
});
</script>

</body>
</html>
