<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT・デジ戦新春ドラコン｜公式スイングチャレンジ</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: repeating-linear-gradient(
        90deg,
        #c00 0px,
        #c00 40px,
        #fff 40px,
        #fff 80px
      );
    }
    h1 {
      margin-top: 10px;
      font-size: 26px;
    }
    .note {
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 15px;
      margin: 15px auto;
      max-width: 520px;
      font-size: 14px;
    }
    button {
      font-size: 18px;
      padding: 12px 22px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    #result h2 { margin-top: 10px; }
  </style>
</head>
<body>

<h1>IT・デジ戦 新春ドラコン</h1>
<p><strong>公式スイングシミュレーション</strong></p>
<p id="authStatus"></p>

<div class="note">
  <strong>【注意事項】</strong><br>
  ・周囲に人や物がないことを確認してください。<br>
  ・スマートフォンの落下に十分ご注意ください。<br>
  ・全力で振る必要はありません。<br>
  ・本企画は体感イベント用のシミュレーションです。
</div>

<div id="app" style="display:none;">
  <p>スマートフォンをゴルフクラブのグリップのように握り、<br>2秒間スイングを行います（全3回）</p>
  <button onclick="startSwing()">スイング開始</button>
  <button onclick="resetAll()">リセット</button>
  <div id="status"></div>
  <div id="result"></div>
</div>

<div class="note" style="margin-top:30px;">
  これは、ChatGPT（無料版）を使用し、<br>
  プロンプトによる指示のみで作成したものです。<br>
  <strong>Kizuna運動 地域社会との絆チーム</strong>
</div>

<script>
/***********************
 * 認証処理（QRトークン方式）
 ***********************/
const VALID_TOKENS = [
  'ITDIGI2026'
];

const token = new URLSearchParams(location.search).get('token');

if (VALID_TOKENS.includes(token)) {
  document.getElementById('authStatus').innerHTML = '🔓 <strong>認証済み</strong>：チャレンジ可能';
  document.getElementById('app').style.display = 'block';
} else {
  document.getElementById('authStatus').innerHTML = '❌ <strong>認証エラー</strong><br>配布されたQRコードからアクセスしてください';
}

/***********************
 * スイング計測処理
 ***********************/
let swings = [];
let listening = false;
let maxAccel = 0;

function startSwing() {
  if (swings.length >= 3) return;
  maxAccel = 0;
  listening = true;
  document.getElementById('status').innerText = `スイング ${swings.length + 1} / 3 測定中…`;

  setTimeout(() => {
    listening = false;
    const distance = accelToDistance(maxAccel);
    swings.push(distance);
    document.getElementById('status').innerText = `スイング${swings.length}：${distance.toFixed(1)} yd`;
    if (swings.length === 3) showResult();
  }, 2000);
}

function accelToDistance(accel) {
  // 体感用簡易モデル（最大300yd未満に制限）
  const raw = accel * 10; // 係数を抑制
  return Math.min(raw, 299.9);
}

function showResult() {
  const avg = swings.reduce((a,b)=>a+b,0)/3;
  const max = Math.max(...swings);
  const min = Math.min(...swings);
  const deviation = max - min;

  let penalty = 0;
  if (deviation > 20) penalty = deviation * 0.2;

  const finalScore = Math.max(avg - penalty, 0);

  document.getElementById('result').innerHTML = `
    <p>平均飛距離：${avg.toFixed(1)} yd</p>
    <p>安定性ペナルティ：-${penalty.toFixed(1)} yd</p>
    <h2>公式記録：${finalScore.toFixed(1)} yd</h2>
  `;
}

function resetAll() {
  swings = [];
  document.getElementById('status').innerText = '';
  document.getElementById('result').innerText = '';
}

window.addEventListener('devicemotion', (e) => {
  if (!listening) return;
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const magnitude = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
  if (magnitude > maxAccel) maxAccel = magnitude;
});
</script>
</body>
</html>
